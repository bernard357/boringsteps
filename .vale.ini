# Vale style lint for Boring Steps pages: flags the AI-writing tells that
# human readers notice. Run it with `make style`. Warnings and suggestions
# never fail the command; they point at sentences worth a second look.
StylesPath = styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = BoringSteps
# VitePress snippet imports (`<<< @/path#region{lang}`) are code, not prose.
BlockIgnores = (?m)^<<< .*$
