  - "in the (?:world|era|age) of"
  - "imagine a world"
  - "have you ever wondered"
  - "let's dive (?:in|into)"
  - "let's explore"
  - "buckle up"
  - "in conclusion"
  - "in summary"
  - "to sum (?:it )?up"
  - "happy coding"
  - "I hope this helps"
  - "the bottom line is"
