[project]
name = "boringsteps-comments"
version = "0.0.0"
description = "Serverless comments back-end for the Boring Steps blog (AWS SAM)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "boto3==1.43.123",
    "moto[dynamodb]==5.2.5",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
